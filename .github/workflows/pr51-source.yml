name: PR51 Source

on:
  pull_request:

jobs:
  package-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        with:
          name: pr51-source
          path: |
            .
            !.git
          include-hidden-files: true
          retention-days: 1
