name: Finalize PR51 Test Modes

on:
  pull_request:

permissions:
  contents: write

jobs:
  finalize:
    if: github.head_ref == 'agent/project-create-api'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/project-create-api
      - name: Set executable test modes and remove helper workflow
        run: |
          chmod +x tests/unit/test-api-project-create.sh
          chmod +x tests/integration/test-api-project-create-parity.sh
          git update-index --chmod=+x tests/unit/test-api-project-create.sh
          git update-index --chmod=+x tests/integration/test-api-project-create-parity.sh
          rm -f .github/workflows/pr51-source.yml
      - name: Commit finalization
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tests/unit/test-api-project-create.sh tests/integration/test-api-project-create-parity.sh .github/workflows/pr51-source.yml
          git commit -m "Finalize project create API tests"
          git push origin HEAD:agent/project-create-api
