name: Issue 60 effective artist patch

on:
  push:
    branches: [agent/project-create-effective-artist]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/project-create-effective-artist
      - name: Apply additive API extension
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          path = Path('lib/project-create-api.sh')
          s = path.read_text()
          old = 'local project_path project_id initial_revision client_path client_id workspace_path'
          new = 'local project_path project_id artist initial_revision client_path client_id workspace_path'
          assert old in s
          s = s.replace(old, new, 1)
          old = 'project_id="$(sed -n \'s/^Project ID:[[:space:]]*//p\' "$output_file" | head -1)"\n    initial_revision='
          new = 'project_id="$(sed -n \'s/^Project ID:[[:space:]]*//p\' "$output_file" | head -1)"\n    artist="$(sed -n \'s/^Artist:[[:space:]]*//p\' "$output_file" | head -1)"\n    initial_revision='
          assert old in s
          s = s.replace(old, new, 1)
          old = '"$python" - "$api_version" "$response_status" "$project_name" "$project_id" \\\n            "$project_path" "$initial_revision" "$client_id" "$client_path" "$workspace_path" "$dry_run"'
          new = '"$python" - "$api_version" "$response_status" "$project_name" "$project_id" "$artist" \\\n            "$project_path" "$initial_revision" "$client_id" "$client_path" "$workspace_path" "$dry_run"'
          assert old in s
          s = s.replace(old, new, 1)
          old = '(api_version, status, project_name, project_id, project_path, initial_revision,\n client_id, client_path, workspace_path, dry_run) = sys.argv[1:]'
          new = '(api_version, status, project_name, project_id, artist, project_path, initial_revision,\n client_id, client_path, workspace_path, dry_run) = sys.argv[1:]'
          assert old in s
          s = s.replace(old, new, 1)
          old = '"project": {"id": project_id, "name": project_name, "path": project_path},'
          new = '"project": {"id": project_id, "name": project_name, "artist": artist, "path": project_path},'
          assert old in s
          s = s.replace(old, new, 1)
          path.write_text(s)

          path = Path('bin/jl-mixing')
          s = path.read_text()
          old = '["delivery.create","intake.validate","project.create","revision.approve","revision.create"]'
          new = '["delivery.create","intake.validate","project.create","project.create.effective_artist","revision.approve","revision.create"]'
          assert old in s
          path.write_text(s.replace(old, new, 1))

          for name in ['planned', 'success']:
              path = Path(f'api/examples/v1.0/{name}/project-create.json')
              doc = json.loads(path.read_text())
              doc['data']['project']['artist'] = 'Example Artist'
              path.write_text(json.dumps(doc, separators=(',', ':'), sort_keys=True) + '\n')

          path = Path('tests/unit/test-api-project-create.sh')
          s = path.read_text()
          old = 'assert d["data"]["project"]["name"] == "API Project"\n'
          new = old + 'assert d["data"]["project"]["artist"] == "API Artist"\n'
          assert old in s
          path.write_text(s.replace(old, new, 1))
          PY
      - name: Verify focused contract
        run: |
          bash tests/unit/test-api-project-create.sh
          bash tests/unit/test-api-system-info.sh
      - name: Commit patch and remove helper
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/issue60-effective-artist.yml
          git add lib/project-create-api.sh bin/jl-mixing api/examples/v1.0/planned/project-create.json api/examples/v1.0/success/project-create.json tests/unit/test-api-project-create.sh
          git commit -m 'Expose effective artist in project.create API'
          git push
