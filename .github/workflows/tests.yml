name: Tests

on:
  push:
  pull_request:

jobs:
  batch3:
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install jq on Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y jq
      - name: Install jq on macOS when needed
        if: runner.os == 'macOS'
        run: command -v jq >/dev/null 2>&1 || brew install jq
      - name: Install Python validation dependency
        run: python -m pip install -r packaging/requirements.txt
      - name: Run strict Batch 3 tests
        env:
          JL_MIXING_PYTHON: ${{ env.pythonLocation }}/bin/python
        run: make strict-test
