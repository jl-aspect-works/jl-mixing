name: Apply Client Create ShellCheck Fix

on:
  push:
    branches:
      - agent/client-create-api

permissions:
  contents: write

jobs:
  apply-fix:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/client-create-api
          fetch-depth: 0
      - name: Apply cleanup
        run: |
          base64 --decode .github/client-create-shellcheck.patch.gz.b64 | gzip -d > /tmp/shellcheck.patch
          patch -p0 < /tmp/shellcheck.patch
          git add bin/jl-mixing
          git rm .github/client-create-shellcheck.patch.gz.b64
          git rm .github/workflows/client-create-shellcheck-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Fix client.create ShellCheck issue"
          git push origin HEAD:agent/client-create-api
