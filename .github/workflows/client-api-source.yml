name: Apply Client API Patch

on:
  push:
    branches:
      - agent/client-create-api

permissions:
  contents: write

jobs:
  apply-patch:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/client-create-api
          fetch-depth: 0
      - name: Apply implementation
        run: |
          base64 --decode .github/client-create-api.patch.gz.b64 | gzip -d > /tmp/client-create-api.patch
          git apply --index /tmp/client-create-api.patch
          git rm .github/client-create-api.patch.gz.b64
          git rm .github/workflows/client-api-source.yml
          git rm docs/.client-create-api-placeholder
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Implement Automation API client.create"
          git push origin HEAD:agent/client-create-api
