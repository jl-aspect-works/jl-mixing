name: Extract Project Service

on:
  pull_request:

permissions:
  contents: write

jobs:
  extract:
    if: github.head_ref == 'agent/project-create-service'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/project-create-service
      - name: Extract shared service
        run: |
          python3 - <<'PY'
          from pathlib import Path
          source = Path('bin/new-mix').read_text()
          marker = 'client_ref=""\n'
          pos = source.index(marker)
          prefix = source[:pos]
          body = source[pos:]
          lib = prefix.replace(
              '#!/usr/bin/env bash\n',
              '#!/usr/bin/env bash\n# Shared project-creation implementation used by new-mix and the Automation API.\n',
              1,
          )
          lib += 'jl_project_create_command() {\n' + body + '\n}\n'
          Path('lib/project-create.sh').write_text(lib)
          Path('bin/new-mix').write_text('''#!/usr/bin/env bash
# Human-facing project creation launcher backed by the shared project-create service.
set -eu

SCRIPT_DIR="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"
APP_ROOT="${JL_MIXING_HOME:-$(cd "$SCRIPT_DIR/.." && pwd)}"
# shellcheck source=lib/project-create.sh
. "$APP_ROOT/lib/project-create.sh"

jl_project_create_command "$@"
''')
          PY
          chmod +x bin/new-mix
          bash -n lib/project-create.sh
          bash -n bin/new-mix
          rm -f .github/workflows/extract-project-service.yml
      - name: Commit extraction
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add bin/new-mix lib/project-create.sh .github/workflows/extract-project-service.yml
          git commit -m "Extract shared project creation service"
          git push origin HEAD:agent/project-create-service
